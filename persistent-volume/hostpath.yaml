apiVersion: v1
kind: Pod
metadata:
 name: hostpath-demo
spec:
  containers:
    - name: busybox-container
      image: busybox
      command: ["sh", "-c", "cat /data && sleep 3600"]
      volumeMounts:
        - name: host-volume
          mountPath: /data
  volumes:
    - name: host-volume
      hostPath:
        path: /tmp/hostfile
        type: FileOrCreate