apiVersion: rbac.authorization.k8s.io/v1 
kind: ClusterRole
metadata:
  name: node-reader
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bind-node-reader
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User        # Type of subject: can be User, Group, or ServiceAccount
  name: seema
roleRef:
  name: node-reader
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io