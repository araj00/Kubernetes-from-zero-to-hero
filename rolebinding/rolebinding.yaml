apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-editor
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-editor
  namespace: default
subjects:
- kind: User
  name: seema
  apiGroup: rbac.authorization.k8s.io
- kind: Group
  name: junior-admins
  apiGroup: rbac.authorization.k8s.io
roleRef:
  name: workload-editor
  kind: Role
  apiGroup: rbac.authorization.k8s.io