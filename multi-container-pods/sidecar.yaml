apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
spec:
# main container
  containers:
  - name: main-app
    image: nginx:latest
    ports:
      - containerPort: 80
#  side-car container
  - name: health-logger
    image: curlimages/curl:latest
    command:
    - sh
    - -c
    - |
      while true; do
        curl -s http://localhost:80 > /dev/null && echo 'Main app is healthy' || echo 'Main app is unhealthy'
        sleep 5
      done
